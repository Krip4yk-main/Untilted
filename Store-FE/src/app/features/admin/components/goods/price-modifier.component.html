<div class="modal-backdrop">
    <div class="modal-content" [formGroup]="form">
        <div class="header">
            <span class="k-big-header">{{ 'priceModifier' | lang: 'misc' }}</span>
            <p-button class="close-btn"
                      icon="pi pi-times"
                      [text]="true"
                      (onClick)="modalClose.emit()"
            ></p-button>
        </div>

        <div class="form-body">
            <p>{{ 'priceModifierDesc' | lang: 'misc' }}</p>

            <div class="form-group">
                <label for="multiplier">{{ 'multiplier' | lang: 'misc' }}</label>
                <p-inputNumber id="multiplier"
                               formControlName="multiplier"
                               mode="decimal"
                               [minFractionDigits]="2"
                               [maxFractionDigits]="2"
                               [step]="0.01"
                               [showButtons]="true"
                               [disabled]="showConfirmation()"
                ></p-inputNumber>
            </div>

            @if (showConfirmation()) {
                <p class="warning">{{ 'confirmPriceModifier' | lang: 'misc' }}</p>
            }
        </div>

        <div class="footer">
            @if (!showConfirmation()) {
                <p-button class="btn btn-primary"
                          (onClick)="confirm()"
                          [label]="'apply' | lang: 'misc'"
                          icon="pi pi-check"
                ></p-button>
            } @else {
                <p-button class="btn btn-danger"
                          (onClick)="apply()"
                          [label]="'apply' | lang: 'misc'"
                          icon="pi pi-exclamation-triangle"
                          severity="danger"
                ></p-button>
                <p-button class="btn btn-secondary"
                          (onClick)="showConfirmation.set(false)"
                          [label]="'cancel' | lang: 'misc'"
                          icon="pi pi-times"
                          severity="secondary"
                ></p-button>
            }
            <p-button class="btn btn-secondary"
                      (onClick)="modalClose.emit()"
                      [disabled]="showConfirmation()"
                      [label]="'close' | lang: 'misc'"
                      icon="pi pi-times"
                      severity="secondary"
            ></p-button>
        </div>
    </div>
</div>
