<div class="user-container">
    @if (authService.user(); as user) {
        <p-card header="User Profile">
            <div class="user-info">
                <p><strong>Name:</strong> {{ user.displayName }}</p>
                <p>You are successfully logged in and can see this protected page.</p>
            </div>
        </p-card>
    }
</div>
