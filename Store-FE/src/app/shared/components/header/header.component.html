<header class="header">
    <div class="logo">
        <a routerLink="/">MIAR store</a>
    </div>

    <div class="store-nav">
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
        >
            <span>Магазин</span>
            <div class="underline"></div>
        </a>
        @if (authService.isLoggedIn() && authService.user()?.role === 'Admin') {
            <a routerLink="/admin"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
            >
                <span>Адмін</span>
                <div class="underline"></div>
            </a>
        }
    </div>

    <div class="nav-list">
        <div class="bucket-nav">
            <p-button routerLink="/bucket"
                      icon="pi pi-shopping-cart"
                      text
                      [badge]="storageService.bucketCount() > 0 ? storageService.bucketCount().toString() : undefined"
                      badgeSeverity="danger"
            ></p-button>
        </div>
        @if (authService.isLoggedIn()) {
            <div>
                <p-button (onClick)="authService.logout()"
                          label="Logout"
                          icon="pi pi-sign-out"
                          text
                ></p-button>
            </div>
        }
        @if (!authService.isLoggedIn()) {
            <div>
                <button class="tg-auth-button"
                        data-style="icon"
                >
                    Sign In with Telegram
                </button>
            </div>
        } @else {
            <div>
                <img [ngSrc]="authService.user()!.avatar"
                     alt="User Info"
                     class="user-avatar"
                     (mouseup)="navigateToUser()"
                     width="32" height="32"
                >
            </div>
        }
    </div>
</header>
